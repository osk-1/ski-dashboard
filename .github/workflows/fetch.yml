name: Record snow data

on:
  # Primary clock: an external scheduler POSTs workflow_dispatch at the exact Vienna times (see README).
  # Backup clock: GitHub cron at off-peak minutes, both UTC offsets (CET/CEST). The gate makes extra triggers no-ops.
  schedule:
    - cron: "7,37 4-18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Skip the time-window and freshness gate
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LIVE: https://osk-1.github.io/ski-dashboard/data

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Gate
        id: gate
        env:
          FORCE: ${{ github.event_name == 'push' || inputs.force }}
          # backup cron needs >50 min old data so it only covers a missed scheduler slot; other triggers >20 min
          MAX_AGE_MIN: ${{ github.event_name == 'schedule' && 50 || 20 }}
        run: |
          run=true
          if [ "$FORCE" != true ]; then
            # Vienna 06:00-19:59 only, and only if the live data is older than MAX_AGE_MIN (unreadable live data counts as stale)
            hour=$(TZ=Europe/Vienna date +%H)
            if [ "$hour" -lt 6 ] || [ "$hour" -ge 20 ]; then
              run=false
            elif curl -fsS --retry 3 "$LIVE/stations.json?t=$(date +%s)" -o /tmp/live.json 2>/dev/null; then
              python3 - <<'PY' || run=false
          import json, datetime as d, sys, os
          try:
              age = d.datetime.now(d.timezone.utc) - d.datetime.fromisoformat(json.load(open("/tmp/live.json"))["updated"])
              sys.exit(0 if age > d.timedelta(minutes=int(os.environ["MAX_AGE_MIN"])) else 1)
          except Exception:
              sys.exit(0)  # any unreadable/corrupt live data counts as stale
          PY
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "gate: run=$run"
      - name: Download live data
        # The generated data files are no longer in git (regions.json is); download them from the live site.
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p data
          for f in stations danger hourly; do
            curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$LIVE/$f.json?t=$(date +%s)" -o "data/$f.json"
          done
          # optional: health.json is rewritten each run and fetch.py does not read it back, so a missing copy is fine
          for f in health; do
            curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$LIVE/$f.json?t=$(date +%s)" -o "data/$f.json" || rm -f "data/$f.json"
          done
      - name: Data-loss guard
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          import json
          # stations.json only: an unreadable hourly.json must stay recoverable (fetch.py starts it empty and backfills)
          s = json.load(open("data/stations.json"))
          assert s.get("stations"), "stations.json empty"
          PY
      # on push (code deploy) an upstream outage must not block shipping; the downloaded live data is redeployed
      - if: steps.gate.outputs.run == 'true'
        continue-on-error: ${{ github.event_name == 'push' }}
        run: python3 fetch.py
      - name: Assemble site
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir _site
          cp -r index.html lib.js overlay.js app.js manifest.webmanifest icons fonts data _site/
      - if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # deploy-pages intermittently finds no artifact ("Found 0 artifact(s)") right after the upload: retry once, only on failure
      - id: deployment
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
